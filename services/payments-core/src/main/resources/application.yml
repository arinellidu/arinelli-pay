server:
  port: 8082

spring:
  application:
    name: payments-core
  http:
    clients:
      connect-timeout: 3s   # provider Pix: timeout curto na borda externa
      read-timeout: 3s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pay}
    username: ${SPRING_DATASOURCE_USERNAME:pay}
    password: ${SPRING_DATASOURCE_PASSWORD:pay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# I5: todo webhook é verificado ou descartado — cada provider com seu mecanismo
webhook:
  hmac-secret: ${WEBHOOK_HMAC_SECRET:change-me}   # fake / pix-sandbox: HMAC-SHA256 no header X-Signature
  efi-secret: ${EFI_WEBHOOK_SECRET:}              # Efí: segredo na query (?hmac=), fail-closed se vazio (ADR-004)

# I4: seleção de provider por configuração; implementações ficam em adapters/
pix:
  provider: ${PIX_PROVIDER:fake}          # fake | sandbox | efi
  sandbox-url: ${PIX_SANDBOX_URL:http://localhost:8080}
  efi:
    base-url: ${EFI_BASE_URL:https://pix-h.api.efipay.com.br}   # homologação; produção: https://pix.api.efipay.com.br
    client-id: ${EFI_CLIENT_ID:}
    client-secret: ${EFI_CLIENT_SECRET:}
    cert-path: ${EFI_CERT_PATH:}                                 # .p12 do painel da Efí (mTLS obrigatório)
    cert-password: ${EFI_CERT_PASSWORD:}                         # vazia nos certificados padrão
    pix-key: ${EFI_PIX_KEY:}
    expiration-seconds: ${EFI_COB_EXPIRACAO:3600}
    connect-timeout: 3s
    read-timeout: 10s                                            # sandbox de PSP é lento: leitura mais folgada que o pix-sandbox local

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [rid:%X{requestId:-}]"
